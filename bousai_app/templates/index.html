{% extends "base.html" %}

{% block content %}
<style>
    .home-content {
        width: min(100% - 32px, 920px);
        margin: 32px auto 86px;
    }

    .home-card {
        padding: 27px 28px 30px;
        border: 1px solid #f0f3f8;
        border-radius: 16px;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 5px 22px rgba(44, 73, 114, .08);
    }

    .home-card + .home-card { margin-top: 38px; }

    .card-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin: 0 0 22px;
        color: var(--text);
        font-size: 25px;
        line-height: 1.3;
    }

    .heading-label { display: flex; align-items: center; gap: 9px; }

    .heading-icon { font-size: 27px; }

    .update-label {
        flex: 0 0 auto;
        color: var(--green);
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
    }

    #shelterMap {
        height: 365px;
        overflow: hidden;
        border-radius: 12px;
    }

    .weather-panel {
        min-height: 154px;
        padding: 21px 20px 16px;
        border-radius: 12px;
        background: #f7f8fa;
    }

    #weatherContent { color: var(--muted); font-size: 15px; }
    #weatherContent p { margin: 0 0 10px; }
    #weatherContent p:first-child { color: #34445b; font-size: 17px; font-weight: 700; }
    #weatherContent p:nth-child(2) { color: var(--green); font-size: 17px; font-weight: 700; }
    #weatherContent ul { margin: 0 0 12px; padding-left: 22px; color: #c23d3d; }

    .weather-meta { margin-top: 8px; }

    @media (max-width: 600px) {
        .home-content { width: min(100% - 20px, 920px); margin-top: 20px; }
        .home-card { padding: 20px 14px 18px; border-radius: 12px; }
        .home-card + .home-card { margin-top: 20px; }
        .card-heading { align-items: flex-start; font-size: 20px; }
        .update-label { font-size: 13px; }
        #shelterMap { height: 300px; }
    }
</style>

<div class="home-content">
    <section class="home-card" aria-labelledby="map-heading">
        <h2 class="card-heading" id="map-heading">
            <span class="heading-label"><span class="heading-icon" aria-hidden="true">📍</span>避難所マップ</span>
        </h2>
        <div id="shelterMap"></div>
    </section>

    <section class="home-card" aria-labelledby="weather-heading">
        <h2 class="card-heading" id="weather-heading">
            <span class="heading-label"><span class="heading-icon" aria-hidden="true">🌤</span>青森市 気象警報・注意報</span>
            <span class="update-label">↻ 10分おき自動更新</span>
        </h2>
        <div class="weather-panel" id="weatherContent">
            <p>読み込み中...</p>
        </div>
    </section>
</div>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市役所周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8246, 140.7400], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
                        warningsHtml = '<p>✅ 現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
                        <p>📍 ${data.area_name || '青森市'}</p>
            ${warningsHtml}
                        <div class="weather-meta">
                            <p>◷ データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
                            <p>⌁ 気象庁発表: ${data.report_time || '不明'}</p>
                        </div>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
